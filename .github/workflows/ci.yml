name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      _TYPER_FORCE_DISABLE_TERMINAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: mypy src tests
      - run: python -m compileall -q src tools
      - run: python -m build
      - run: python -m tracefold --help
      - run: python -m tracefold compress --help
      - run: python -m tracefold benchmark --help
      - run: python -c "from tracefold.api import app; print(app.title)"
      - run: python -m tracefold schema certificate --check
      - run: python -m tracefold schema source-map --check
      - name: Deterministic Phase 6 report
        run: |
          python -m tracefold.phase6_report > /tmp/phase6-a.json
          python -m tracefold.phase6_report > /tmp/phase6-b.json
          cmp /tmp/phase6-a.json /tmp/phase6-b.json
      - name: Deterministic Phase 7 prepare
        run: |
          tracefold benchmark prepare --tokenizer-backend tiktoken --tokenizer-encoding cl100k_base --output-dir /tmp/phase7-a
          tracefold benchmark prepare --tokenizer-backend tiktoken --tokenizer-encoding cl100k_base --output-dir /tmp/phase7-b
          cmp /tmp/phase7-a/benchmark-items.jsonl /tmp/phase7-b/benchmark-items.jsonl
          cmp /tmp/phase7-a/benchmark-methods.json /tmp/phase7-b/benchmark-methods.json
          cmp /tmp/phase7-a/prepared-contexts.jsonl /tmp/phase7-b/prepared-contexts.jsonl
      - name: Compression API smoke
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from tracefold.api import app
          payload = {
              "source_text": "Boilerplate. Boilerplate. timeout = 30 seconds.",
              "source_kind": "document",
              "tokenizer_backend": "fixture-only",
              "tokenizer_encoding": "utf8-byte",
          }
          response = TestClient(app).post("/v1/compress", json=payload)
          assert response.status_code == 200, response.text
          PY
      - name: Deterministic UI export
        run: |
          python tools/export_ui_demo_data.py
          cp web/public/demo-data/index.json /tmp/tracefold-ui-a.json
          python tools/export_ui_demo_data.py
          cmp /tmp/tracefold-ui-a.json web/public/demo-data/index.json
      - name: Wheel installation smoke
        run: |
          python -m venv /tmp/tracefold-wheel
          /tmp/tracefold-wheel/bin/python -m pip install dist/*.whl
          /tmp/tracefold-wheel/bin/tracefold --help
          /tmp/tracefold-wheel/bin/tracefold compress --help
          /tmp/tracefold-wheel/bin/tracefold benchmark --help
          /tmp/tracefold-wheel/bin/python -c "from tracefold.api import app; print(app.title)"
          /tmp/tracefold-wheel/bin/tracefold schema certificate --check
          /tmp/tracefold-wheel/bin/tracefold schema source-map --check
          printf 'Boilerplate. Boilerplate. timeout = 30 seconds.' | /tmp/tracefold-wheel/bin/tracefold compress - --kind document --tokenizer-backend fixture-only --tokenizer-encoding utf8-byte

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
