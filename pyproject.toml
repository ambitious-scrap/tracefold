[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tracefold"
version = "0.1.0"
description = "Deterministic TraceFold domain scaffolding"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2,<3", "fastapi>=0.115,<1", "typer>=0.16,<1", "rfc8785>=0.1,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.12,<1", "mypy>=1.17,<2", "build>=1,<2"]

[project.scripts]
tracefold = "tracefold.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tracefold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".agents", ".serena", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
